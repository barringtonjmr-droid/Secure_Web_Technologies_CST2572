<!doctype html>
<html lang="en">
<head>
    <meta charset = "utf-8">
    <link rel="stylesheet" href="style.css">
    <title>Appointments</title>
</head>  
<body>
    <h2>Login</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#appointment">Make an Appointment</a>
        <a href="#health">Health Record</a>
        <a href="#register">Registration</a>
        <a href="#allhealth" hidden>View all health records</a>
    </nav>
    <section id="home" class="page">
        <h2>Welcome to PrimeHealth</h2>
        <p>Maybe About Us</p>
    </section>

    <section id="register" class="page" hidden>
        <h2>Patient Registration</h2>

        <form id="patientForm">
            <label for="patientName">Full name</label>
            <input id="patientName" name="name" required>

            <label for="patientEmail">Email</label>
            <input id="patientEmail" name="email" required>

            <label for="patientPhone">Phone</label>
            <input id="patientPhone" name="phone" tpye="tel" required>

            <button type="submit">Register</button>

        </form>

        <p id="registerMessage" role="status"></p>
    </section>

    <section id="appointment" class="page" hidden>
        <h2>Appointments</h2>
        <form id="appointmentForm">
            <label for="appointmentPatient">Patient</label>
            <select id="appointmentPatient" required>
                <option value="">Choose a patient</option>
            </select>

            <label for="appointmentDoctor">Doctor</label>
            <select id="appointmentDoctor" required>
                <option value="">Choose a Doctor</option>
            </select>
             <label for="appointmentDate">Date</label>
            <input id="appointmentDate" type="date" required />

            <label for="appointmentTime">Time</label>
            <input id="appointmentTime" type="time" required />

            <button type="submit">Create Appointment</button>
        </form>
        <p id="appointmentMessage" role="status"></p>

        <button id="loadAppointments">
            Load Appointments
        </button>
        <p id="message"></p>
        <div id="appointmentList"></div>
    </section>

    <section id="health" class="page" hidden>
        <h2>View your health record</h2>
        <p></p>
    </section>

    <section id="allhealth" class="page" hidden>
        <h2>Doctor's Dashboard</h2>
        <p>View all patients records here</p>
    </section>  

<script src="app.js"></script>
</body>  
</html>
